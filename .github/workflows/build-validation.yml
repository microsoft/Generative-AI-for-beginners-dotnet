name: .NET Build Validation

'on':
  pull_request:
    branches: [ main ]
    paths:
    - 'samples/**/*.cs'
    - 'samples/**/*.csproj'
    - 'samples/**/*.sln'
    - 'samples/**/*.slnx'
    - 'samples/**/*.razor'
    - 'samples/**/*.json'
    - '.github/workflows/build-validation.yml'

jobs:
  build:
    name: Build .NET Projects
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false  # Show results for all projects even if some fail
      matrix:
        solution:
        - path: "samples/CoreSamples/CoreGenerativeAITechniques.sln"
          name: "Core Samples"
        - path: "samples/PracticalSamples/Aspire.MCP.Sample.sln"
          name: "Practical Samples - Aspire MCP"
        - path: "samples/AppsWithGenAI/HFMCP.GenImage/HFMCP.GenImage.sln"
          name: "HFMCP GenImage App"
        - path: "samples/AppsWithGenAI/SpaceAINet/SpaceAINet.sln"
          name: "SpaceAINet App"
        - path: "samples/MAF/MAF-Demos.slnx"
          name: "MAF Demos"

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies for ${{ matrix.solution.name }}
      run: dotnet restore "${{ matrix.solution.path }}" -p:EnableWindowsTargeting=true

    - name: Build ${{ matrix.solution.name }}
      run: dotnet build "${{ matrix.solution.path }}" --no-restore --configuration Release --verbosity minimal -p:EnableWindowsTargeting=true

    - name: Run tests for ${{ matrix.solution.name }}
      if: matrix.solution.name == 'Core Samples'
      run: dotnet test "samples/CoreSamples/AzFunction-BasicChat-01/AzFunction-BasicChat-01.Tests/AzFunction-BasicChat-01.Tests.csproj" --no-build --configuration Release --verbosity minimal

    - name: Display build result
      if: success()
      run: echo "✅ ${{ matrix.solution.name }} build succeeded"

  discover-file-based-apps:
    name: Discover file-based app.cs samples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Discover tracked app.cs samples
      id: discover
      shell: bash
      run: |
        set -euo pipefail

        # Exclusion list (documented, currently empty):
        # Add repo-relative paths exactly as reported by `git ls-files` below, one per
        # line, each with a comment explaining why the sample cannot be compiled here
        # (for example, a future OS-specific or credential-only file-based app). Every
        # tracked app.cs sample must compile secret-free today, so this list is empty.
        EXCLUDED_SAMPLES=(
        )

        mapfile -t all_samples < <(git ls-files 'samples/**/app.cs' | sort)

        samples=()
        for sample in "${all_samples[@]}"; do
          excluded=false
          for excluded_sample in "${EXCLUDED_SAMPLES[@]:-}"; do
            if [[ "$sample" == "$excluded_sample" ]]; then
              excluded=true
              break
            fi
          done
          if [[ "$excluded" == false ]]; then
            samples+=("$sample")
          fi
        done

        if [ "${#samples[@]}" -eq 0 ]; then
          echo "::error::No file-based app.cs samples discovered."
          exit 1
        fi

        matrix_json=$(printf '%s\n' "${samples[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0)) | {sample: .}')

        echo "Discovered ${#samples[@]} file-based app.cs sample(s):"
        printf '  - %s\n' "${samples[@]}"

        echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  compile-file-based-apps:
    name: 'Compile file-based sample: ${{ matrix.sample }}'
    needs: discover-file-based-apps
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false  # Show results for every file-based sample even if some fail
      matrix: ${{ fromJson(needs.discover-file-based-apps.outputs.matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Compile ${{ matrix.sample }}
      env:
        SAMPLE_PATH: ${{ matrix.sample }}
      run: dotnet build "$SAMPLE_PATH" --verbosity minimal

    - name: Display build result
      if: success()
      env:
        SAMPLE_PATH: ${{ matrix.sample }}
      run: echo "✅ $SAMPLE_PATH compiled successfully"