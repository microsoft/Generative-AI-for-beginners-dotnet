name: .NET Build Validation

'on':
  pull_request:
    branches: [ main ]
    paths:
    - 'samples/**/*.cs'
    - 'samples/**/*.csproj'
    - 'samples/**/*.sln'
    - 'samples/**/*.slnx'
    - 'samples/**/*.razor'
    - 'samples/**/*.json'
    - '.github/workflows/build-validation.yml'

jobs:
  build:
    name: Build .NET Projects
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false  # Show results for all projects even if some fail
      matrix:
        solution:
        - path: "samples/CoreSamples/CoreGenerativeAITechniques.sln"
          name: "Core Samples"
        - path: "samples/PracticalSamples/Aspire.MCP.Sample.sln"
          name: "Practical Samples - Aspire MCP"
        - path: "samples/AppsWithGenAI/HFMCP.GenImage/HFMCP.GenImage.sln"
          name: "HFMCP GenImage App"
        - path: "samples/AppsWithGenAI/SpaceAINet/SpaceAINet.sln"
          name: "SpaceAINet App"
        - path: "samples/MAF/MAF-Demos.slnx"
          name: "MAF Demos"

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies for ${{ matrix.solution.name }}
      run: dotnet restore "${{ matrix.solution.path }}" -p:EnableWindowsTargeting=true

    - name: Build ${{ matrix.solution.name }}
      run: dotnet build "${{ matrix.solution.path }}" --no-restore --configuration Release --verbosity minimal -p:EnableWindowsTargeting=true

    - name: Run tests for ${{ matrix.solution.name }}
      if: matrix.solution.name == 'Core Samples'
      run: dotnet test "samples/CoreSamples/AzFunction-BasicChat-01/AzFunction-BasicChat-01.Tests/AzFunction-BasicChat-01.Tests.csproj" --no-build --configuration Release --verbosity minimal

    - name: Display build result
      if: success()
      run: echo "✅ ${{ matrix.solution.name }} build succeeded"