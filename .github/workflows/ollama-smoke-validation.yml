name: Ollama Smoke Validation (opt-in)

# Manually triggered only. This workflow installs a real Ollama daemon from a pinned,
# checksum-verified release asset, pulls a single fixed small model, and exercises the
# request + streaming paths of the three file-based samples that talk to Ollama through
# OllamaSharp. It exists because compilation (build-validation.yml) cannot catch
# runtime-only failures such as the OllamaSharp serialization bug fixed in #528 — that
# bug only surfaced on the first live model call.
#
# Scope (see "Validated File-Based app.cs Samples — Ollama Smoke Validation" in
# AGENTS.md for the full policy):
#   - samples/CoreSamples/BasicChat-03Ollama/app.cs           (request path, as committed)
#   - samples/CoreSamples/BasicChat-10ConversationHistory/app.cs
#       (Ollama fallback path, streaming, multi-turn context — no Azure secrets set)
#   - samples/CoreSamples/BasicChat-07Ollama-gpt-oss/app.cs
#       (runner-local TEMP COPY only, with gpt-oss:20b swapped for the pinned model;
#        the tracked source file is never modified)
#
# Model policy: OLLAMA_MODEL below is the single source of truth for the pinned model
# tag (phi4-mini). It is NOT exposed as a workflow_dispatch input — an arbitrary
# operator-supplied model tag would be unpulled/unpinned and could silently invalidate
# every assertion in this workflow. To change the pinned model, edit OLLAMA_MODEL here
# and the matching policy text in AGENTS.md together.
#
# Install policy: Ollama is installed from the official versioned GitHub release asset
# (not `curl | sh`, which fetches a mutable script and runs it as root). The exact
# release tag and the artifact's published SHA-256 digest (from the release's own
# sha256sum.txt, cross-checked by downloading and hashing the artifact) are pinned
# below and verified with `sha256sum --check` before the archive is ever extracted.
#
# No repository/org/cloud secrets are used. Nothing secret is ever printed.
'on':
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ollama-smoke:
    name: Ollama smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Single documented pinned-model constant (see AGENTS.md). Not overridable.
      OLLAMA_MODEL: phi4-mini
      OLLAMA_HOST_URL: http://127.0.0.1:11434
      # Pinned Ollama release (linux/amd64) + its official published SHA-256 digest.
      # Digest verified against https://github.com/ollama/ollama/releases/download/v0.12.11/sha256sum.txt
      OLLAMA_RELEASE_VERSION: v0.12.11
      OLLAMA_RELEASE_ASSET: ollama-linux-amd64.tgz
      OLLAMA_RELEASE_SHA256: fb140ea4243706d0087b0108418ee5c6f74edcebf5f14e2f289b8e36bd303d0f

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Install Ollama (pinned release, checksum-verified)
      id: install
      shell: bash
      run: |
        set -euo pipefail
        echo "### Ollama install" >> "$GITHUB_STEP_SUMMARY"

        download_url="https://github.com/ollama/ollama/releases/download/${OLLAMA_RELEASE_VERSION}/${OLLAMA_RELEASE_ASSET}"
        archive_path="$RUNNER_TEMP/${OLLAMA_RELEASE_ASSET}"
        install_dir="$RUNNER_TEMP/ollama-${OLLAMA_RELEASE_VERSION}"

        curl --fail --show-error --silent --location \
          --connect-timeout 10 --max-time 120 \
          --output "$archive_path" "$download_url"

        printf '%s  %s\n' "$OLLAMA_RELEASE_SHA256" "$archive_path" > "$archive_path.sha256"
        if ! sha256sum --check --strict "$archive_path.sha256"; then
          echo "- ❌ Downloaded artifact failed SHA-256 verification against the pinned digest — aborting, not extracting" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        mkdir -p "$install_dir"
        tar -xzf "$archive_path" -C "$install_dir"
        rm -f "$archive_path" "$archive_path.sha256"

        echo "$install_dir/bin" >> "$GITHUB_PATH"
        echo "- ✅ Installed Ollama ${OLLAMA_RELEASE_VERSION} from the pinned release asset (SHA-256 verified, no installer script executed, no root required)" >> "$GITHUB_STEP_SUMMARY"

    - name: Verify Ollama binary
      shell: bash
      run: ollama --version

    - name: Start Ollama daemon
      id: start
      shell: bash
      run: |
        set -euo pipefail
        nohup ollama serve > ollama-serve.log 2>&1 &
        echo "$!" > ollama.pid
        echo "Started Ollama daemon with PID $(cat ollama.pid)"

    - name: Wait for Ollama readiness
      id: readiness
      shell: bash
      run: |
        set -euo pipefail
        echo "### Ollama readiness" >> "$GITHUB_STEP_SUMMARY"
        ready=false
        for attempt in $(seq 1 30); do
          if curl --fail --silent --show-error \
            --connect-timeout 2 --max-time 5 \
            "$OLLAMA_HOST_URL/api/version" > /dev/null 2>&1; then
            ready=true
            break
          fi
          sleep 2
        done
        if [ "$ready" = true ]; then
          echo "- ✅ Ollama API responded after ${attempt} attempt(s) (bounded to 60s)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "- ❌ Ollama API did not become ready within 60s" >> "$GITHUB_STEP_SUMMARY"
          echo "---- ollama-serve.log ----"
          cat ollama-serve.log || true
          exit 1
        fi

    - name: Pull pinned model
      id: pull-model
      shell: bash
      run: |
        set -euo pipefail
        echo "### Model pull" >> "$GITHUB_STEP_SUMMARY"
        echo "Pulling model tag: $OLLAMA_MODEL"
        if timeout 900 ollama pull "$OLLAMA_MODEL"; then
          echo "- ✅ Pulled \`$OLLAMA_MODEL\` (bounded to 900s)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "- ❌ Failed to pull \`$OLLAMA_MODEL\` within 900s" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Smoke test BasicChat-03Ollama (request path)
      id: sample-03
      shell: bash
      working-directory: samples/CoreSamples/BasicChat-03Ollama
      run: |
        set -euo pipefail
        echo "### Sample: BasicChat-03Ollama" >> "$GITHUB_STEP_SUMMARY"

        output_file="$RUNNER_TEMP/basicchat-03-output.txt"
        if timeout 180 dotnet run app.cs > "$output_file" 2>&1; then
          exit_status=0
        else
          exit_status=$?
        fi

        cat "$output_file"

        word_count=$(wc -w < "$output_file")
        if [ "$exit_status" -ne 0 ]; then
          echo "- ❌ Sample exited with status $exit_status" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if [ "$word_count" -lt 15 ]; then
          echo "- ❌ Sample exited 0 but produced only $word_count word(s) — treating as no model response" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if grep -qiE "unhandled exception|System\.Exception|StackTrace|System\.Text\.Json" "$output_file"; then
          echo "- ❌ Sample output contains an exception/serialization error signature" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "- ✅ Sample exited 0 with a ${word_count}-word model response, no exception signatures" >> "$GITHUB_STEP_SUMMARY"

    - name: Smoke test BasicChat-10ConversationHistory (live Ollama streaming)
      id: sample-10-live
      shell: bash
      working-directory: samples/CoreSamples/BasicChat-10ConversationHistory
      run: |
        set -euo pipefail
        echo "### Sample: BasicChat-10ConversationHistory (live provider)" >> "$GITHUB_STEP_SUMMARY"

        # No Azure user-secrets are configured on this runner, so the sample's own
        # fallback logic selects the real local Ollama provider. This check remains
        # deliberately separate from deterministic history-payload verification.
        output_file="$RUNNER_TEMP/basicchat-10-output.txt"
        if printf 'Reply with one short word.\n\n' \
          | timeout 180 dotnet run app.cs > "$output_file" 2>&1; then
          exit_status=0
        else
          exit_status=$?
        fi

        cat "$output_file"

        if [ "$exit_status" -ne 0 ]; then
          echo "- ❌ Sample exited with status $exit_status" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if ! grep -q "Ollama · phi4-mini" "$output_file"; then
          echo "- ❌ Sample did not report the expected Ollama fallback label — Azure path may have been selected" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        response_file="$RUNNER_TEMP/basicchat-10-live-response.txt"
        if ! python3 - "$output_file" "$response_file" <<'PY'
        import sys

        output_path, response_path = sys.argv[1:3]
        text = open(output_path, encoding="utf-8", errors="replace").read()
        parts = text.split("Q (empty to exit): ")
        if len(parts) < 2 or not parts[1].startswith("AI: "):
            print("Could not find the streamed response.", file=sys.stderr)
            sys.exit(1)
        open(response_path, "w", encoding="utf-8").write(parts[1][len("AI: "):].strip())
        PY
        then
          echo "- ❌ Could not parse a streamed response from the live provider" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        response_words=$(wc -w < "$response_file")
        if [ "$response_words" -lt 1 ]; then
          echo "- ❌ Live streamed response was empty" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        if grep -qiE "unhandled exception|System\.Exception|StackTrace" "$output_file"; then
          echo "- ❌ Sample output contains an exception signature" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if ! git diff --quiet -- app.cs; then
          echo "- ❌ Tracked BasicChat-10 source was modified" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "- ✅ Live Ollama fallback selected with a non-empty streamed response (${response_words} words), no exceptions, and no source mutation" >> "$GITHUB_STEP_SUMMARY"

    - name: Stop Ollama before deterministic boundary check
      id: stop-for-boundary
      shell: bash
      run: |
        set -euo pipefail
        kill "$(cat ollama.pid)"
        for attempt in $(seq 1 30); do
          if ! curl --silent --connect-timeout 1 "$OLLAMA_HOST_URL/api/version" >/dev/null 2>&1; then
            rm -f ollama.pid
            exit 0
          fi
          sleep 1
        done
        echo "Ollama did not release port 11434 within 30 seconds"
        exit 1

    - name: Verify BasicChat-10 conversation payload at client boundary
      id: sample-10-boundary
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        echo "### Sample: BasicChat-10ConversationHistory (client boundary)" >> "$GITHUB_STEP_SUMMARY"

        capture_file="$RUNNER_TEMP/basicchat-10-requests.json"
        stub_log="$RUNNER_TEMP/basicchat-10-boundary.log"
        python3 .github/scripts/ollama-history-boundary.py serve "$capture_file" >"$stub_log" 2>&1 &
        stub_pid=$!
        trap 'kill "$stub_pid" 2>/dev/null || true' EXIT
        sleep 1
        if ! kill -0 "$stub_pid" 2>/dev/null; then
          cat "$stub_log"
          echo "- ❌ Deterministic boundary stub did not start" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        output_file="$RUNNER_TEMP/basicchat-10-boundary-output.txt"
        if printf 'boundary-first-user-turn\nboundary-second-user-turn\n\n' \
          | timeout 180 dotnet run samples/CoreSamples/BasicChat-10ConversationHistory/app.cs \
            >"$output_file" 2>&1; then
          sample_status=0
        else
          sample_status=$?
        fi
        if wait "$stub_pid"; then
          boundary_status=0
        else
          boundary_status=$?
        fi
        trap - EXIT

        cat "$output_file"
        cat "$stub_log"
        cat "$capture_file"
        if [ "$sample_status" -ne 0 ]; then
          echo "- ❌ Sample exited with status $sample_status against the boundary stub" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if [ "$boundary_status" -ne 0 ]; then
          echo "- ❌ Second outbound request did not contain the exact first response with role assistant and the second user turn" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if grep -qiE "unhandled exception|System\.Exception|StackTrace" "$output_file"; then
          echo "- ❌ Boundary run contains an exception signature" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if ! git diff --quiet -- samples/CoreSamples/BasicChat-10ConversationHistory/app.cs; then
          echo "- ❌ Tracked BasicChat-10 source was modified" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "- ✅ Observed the exact first assistant response with role assistant beside the second user turn in request 2" >> "$GITHUB_STEP_SUMMARY"

    - name: Restart Ollama after deterministic boundary check
      id: restart
      if: always() && steps.stop-for-boundary.outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail
        nohup ollama serve > ollama-serve-restarted.log 2>&1 &
        echo "$!" > ollama.pid
        for attempt in $(seq 1 30); do
          if curl --fail --silent --show-error \
            --connect-timeout 2 --max-time 5 \
            "$OLLAMA_HOST_URL/api/version" > /dev/null 2>&1; then
            exit 0
          fi
          sleep 2
        done
        cat ollama-serve-restarted.log || true
        exit 1

    - name: Smoke test BasicChat-07Ollama-gpt-oss (runner-local pinned-model copy)
      id: sample-07
      if: steps.restart.outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail
        echo "### Sample: BasicChat-07Ollama-gpt-oss (temp copy substitution)" >> "$GITHUB_STEP_SUMMARY"

        # The tracked source is never modified. We copy it to a runner-local temp
        # directory outside the repo working tree and only swap the model tag there.
        src_dir="samples/CoreSamples/BasicChat-07Ollama-gpt-oss"
        tmp_dir="$RUNNER_TEMP/basicchat-07-${OLLAMA_MODEL}"
        rm -rf "$tmp_dir"
        mkdir -p "$tmp_dir"
        cp "$src_dir/app.cs" "$tmp_dir/app.cs"

        # Model-tag drift risk: this substitution assumes the pinned OLLAMA_MODEL's
        # smaller size and non-reasoning profile is an acceptable stand-in for
        # gpt-oss:20b's reasoning behavior purely to exercise the OllamaSharp request
        # path. It does NOT validate gpt-oss:20b-specific reasoning output — see
        # AGENTS.md for the documented policy. OLLAMA_MODEL is a fixed workflow
        # constant (not operator input), so substituting it via sed carries no
        # injection risk.
        sed -i "s/gpt-oss:20b/${OLLAMA_MODEL}/" "$tmp_dir/app.cs"
        if grep -q "gpt-oss:20b" "$tmp_dir/app.cs"; then
          echo "- ❌ Model tag substitution failed on the temp copy" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        # Confirm the tracked source file itself was never touched.
        if ! git diff --quiet -- "$src_dir/app.cs"; then
          echo "- ❌ Tracked source was modified — this must never happen" >> "$GITHUB_STEP_SUMMARY"
          git diff -- "$src_dir/app.cs"
          exit 1
        fi

        output_file="$RUNNER_TEMP/basicchat-07-output.txt"
        if (cd "$tmp_dir" && timeout 180 dotnet run app.cs) > "$output_file" 2>&1; then
          exit_status=0
        else
          exit_status=$?
        fi

        cat "$output_file"

        word_count=$(wc -w < "$output_file")
        if [ "$exit_status" -ne 0 ]; then
          echo "- ❌ Sample exited with status $exit_status" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if [ "$word_count" -lt 15 ]; then
          echo "- ❌ Sample exited 0 but produced only $word_count word(s) — treating as no model response" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if grep -qiE "unhandled exception|System\.Exception|StackTrace|System\.Text\.Json" "$output_file"; then
          echo "- ❌ Sample output contains an exception/serialization error signature" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "- ✅ Temp copy compiled/ran against ${OLLAMA_MODEL}, tracked source untouched, ${word_count}-word response, no exception signatures" >> "$GITHUB_STEP_SUMMARY"

    - name: Stop Ollama daemon
      if: always()
      shell: bash
      run: |
        set +e
        if [ -f ollama.pid ]; then
          kill "$(cat ollama.pid)" 2>/dev/null
        fi
        pkill -f "ollama serve" 2>/dev/null
        exit 0

    - name: Enforce conversation-boundary result
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.sample-10-boundary.outcome }}" != "success" ]; then
          echo "Deterministic conversation-history boundary verification failed."
          exit 1
        fi
