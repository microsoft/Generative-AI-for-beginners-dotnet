version: 2
updates:
  # Cover the current centralized samples, including nested Aspire projects.
  - package-ecosystem: "nuget"
    directories:
      - "/samples/**"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
